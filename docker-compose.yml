name: crm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      CRM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_local_only}@postgres:5432/${POSTGRES_DB:-crm}
      CRM_CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
      CRM_VIDEO_ENABLED: ${CRM_VIDEO_ENABLED:-false}
      CRM_LIVEKIT_URL: ${CRM_LIVEKIT_URL:-http://livekit:7880}
      CRM_LIVEKIT_PUBLIC_URL: ${CRM_LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      CRM_LIVEKIT_API_KEY: ${CRM_LIVEKIT_API_KEY:-}
      CRM_LIVEKIT_API_SECRET: ${CRM_LIVEKIT_API_SECRET:-}
      CRM_SESSION_COOKIE_SECURE: ${CRM_SESSION_COOKIE_SECURE:-false}
      CRM_FRONTEND_URL: ${CRM_FRONTEND_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "/app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/uvicorn crm.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    profiles: ["redis"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: ["video"]
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${CRM_LIVEKIT_API_KEY:-unconfigured}: ${CRM_LIVEKIT_API_SECRET:-unconfigured}"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

  livekit-test:
    image: livekit/livekit-server:v1.13.10
    profiles: ["test-video"]
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./infra/livekit-test.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:17880:17880"
      - "127.0.0.1:17881:17881"
      - "127.0.0.1:17882:17882/udp"

  gateway-test:
    image: caddy:2-alpine
    profiles: ["test-tls"]
    volumes:
      - ./infra/Caddyfile.test:/etc/caddy/Caddyfile:ro
      - caddy_test_data:/data
    ports:
      - "127.0.0.1:18443:443"
      - "127.0.0.1:18444:444"

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: crm_test
      POSTGRES_USER: crm_test
      POSTGRES_PASSWORD: crm_test_local_only
    ports:
      - "127.0.0.1:5543:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_test -d crm_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
  redis_data:
  caddy_test_data:
